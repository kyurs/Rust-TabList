[package]
name = "rust-tab-list"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.62.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
